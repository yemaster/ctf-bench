name: test

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run end-to-end API test
        run: python3 test_api.py
      - name: Validate challenge manifest
        run: python3 server.py --list-challenges
